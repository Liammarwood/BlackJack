name: Android Continuous Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      BUILD_VERSION: 1.0.${{ github.run_number }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Resonance
          customParameters: -buildVersion ${{ env.BUILD_VERSION }} -androidVersionCode ${{ env.ANDROID_VERSION_CODE }}

      - name: Build Android App Bundle
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          androidExportType: androidAppBundle
          buildName: Resonance
          customParameters: -buildVersion ${{ env.BUILD_VERSION }} -androidVersionCode ${{ env.ANDROID_VERSION_CODE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds-${{ github.run_number }}
          path: build/Android/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            build/**/*.apk
            build/**/*.aab
